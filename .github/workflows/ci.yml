# MerchantHub CI: on every push / PR, build + run all tests (unit + Testcontainers integration tests) + produce coverage reports
name: CI

on:
  push:
  pull_request:

# Cancel unfinished older builds when the same branch is pushed again
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Infrastructure code goes through CI too -- formatting, syntax, references (no AWS connection or credentials; real plans run locally)
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/bootstrap infra/env; do
            terraform -chdir="$d" init -backend=false -input=false > /dev/null
            terraform -chdir="$d" validate
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The Maven Wrapper downloads Maven itself from Maven Central on first run, which occasionally fails on runners (red in 0 seconds):
      # cache the download (setup-java's maven cache only covers ~/.m2/repository, not the wrapper) and retry 3 times
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven (retry)
        run: |
          for i in 1 2 3; do
            ./mvnw -B -v && exit 0
            echo "Maven download attempt $i failed, retrying in 20 seconds"; sleep 20
          done
          exit 1

      # GitHub's ubuntu runners ship with Docker, so Testcontainers works with no extra setup
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Aggregate each module's jacoco.csv into a table on this run's Summary page
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Line coverage (JaCoCo, unit + integration tests merged)"
            echo ""
            echo "| Module | Covered / total lines | Coverage |"
            echo "|---|---|---|"
            found=0
            for f in */target/site/jacoco/jacoco.csv; do
              [ -f "$f" ] || continue
              found=1
              awk -F, -v m="${f%%/*}" 'NR>1 {miss+=$8; cov+=$9}
                END {t=miss+cov; printf "| %s | %d / %d | %.1f%% |\n", m, cov, t, (t ? cov*100/t : 0)}' "$f"
            done
            [ "$found" = 1 ] || echo "| (no coverage data) | - | - |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore
