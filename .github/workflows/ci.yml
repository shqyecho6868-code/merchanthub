# MerchantHub CI：每次 push / PR 构建 + 跑全部测试（单测 + Testcontainers 集成测试）+ 产出覆盖率报告
name: CI

on:
  push:
  pull_request:

# 同一分支连续 push 时，取消还没跑完的旧构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Maven Wrapper 第一次运行要从 Maven Central 下载 Maven 本体。runner 偶发下载失败（D1 连续两次 0 秒就红，P31）：
      # 缓存下载结果（setup-java 的 maven 缓存只管 ~/.m2/repository，不含 wrapper），并重试 3 次
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven (retry)
        run: |
          for i in 1 2 3; do
            ./mvnw -B -v && exit 0
            echo "第 $i 次下载 Maven 失败，20 秒后重试"; sleep 20
          done
          exit 1

      # GitHub 的 ubuntu runner 自带 Docker，Testcontainers 直接可用，不需要额外配置
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # 把各模块 jacoco.csv 汇总成表格，显示在本次运行的 Summary 页
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## 行覆盖率（JaCoCo，单测 + 集成测试合并）"
            echo ""
            echo "| 模块 | 覆盖行 / 总行 | 覆盖率 |"
            echo "|---|---|---|"
            found=0
            for f in */target/site/jacoco/jacoco.csv; do
              [ -f "$f" ] || continue
              found=1
              awk -F, -v m="${f%%/*}" 'NR>1 {miss+=$8; cov+=$9}
                END {t=miss+cov; printf "| %s | %d / %d | %.1f%% |\n", m, cov, t, (t ? cov*100/t : 0)}' "$f"
            done
            [ "$found" = 1 ] || echo "| （无覆盖率数据） | - | - |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore
