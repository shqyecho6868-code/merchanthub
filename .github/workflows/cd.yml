# MerchantHub CD: once CI is green on main, build images for all 6 services -> push to ECR -> rolling-update ECS.
#
# Kept as a separate workflow (triggered by workflow_run) rather than an extra job in CI:
#   - the cloud environment is usually destroyed, so CD mostly "skips"; splitting keeps CI's red/green about the code only
#   - manual runs (Run workflow in the Actions tab, or gh workflow run cd.yml) can deploy without re-running the 10+ minute test suite
#
# AWS credentials: no access keys stored. GitHub signs an OIDC token for this run, exchanged for 1-hour temporary credentials (role created by infra/bootstrap).
# The only repo secret is AWS_DEPLOY_ROLE_ARN (a role ARN isn't a secret; it's in Secrets just to keep it out of the repo)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deployment at a time; new runs queue behind the old one instead of cancelling it (a half-cancelled deploy leaves services on mixed versions)
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  id-token: write   # needed for the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER: merchanthub

jobs:
  deploy:
    # Deploy only after a successful CI run triggered by a push to main (PR CI never deploys); manual runs deploy current main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      # Deploy the exact commit CI tested, not whatever main points to now (they may differ)
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check deploy role
        id: gate
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::Secret AWS_DEPLOY_ROLE_ARN not configured, skipping deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gate.outputs.go == 'true'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The environment is created and destroyed the same day: if the cluster is gone, skip (finish green) instead of failing
      - name: Check environment is up
        id: env
        if: steps.gate.outputs.go == 'true'
        run: |
          status=$(aws ecs describe-clusters --clusters "$CLUSTER" --query 'clusters[0].status' --output text 2>/dev/null || true)
          if [ "$status" = "ACTIVE" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloud environment not up (ECS cluster $CLUSTER does not exist), skipping deploy"
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.env.outputs.up == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-java@v6
        if: steps.env.outputs.up == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests already ran in CI for this same commit; only package here
      - name: Package jars
        if: steps.env.outputs.up == 'true'
        run: |
          for i in 1 2 3; do ./mvnw -B -v > /dev/null && break; echo "Maven download failed, retrying"; sleep 20; done
          ./mvnw -B -ntp package -DskipTests

      - name: Login to ECR
        id: ecr
        if: steps.env.outputs.up == 'true'
        uses: aws-actions/amazon-ecr-login@v2.2.0

      # Per service: build the image (tag = git sha; the repo uses immutable tags) -> register a new task-definition revision with the new image -> update the service.
      # Terraform sets ignore_changes = [task_definition] on aws_ecs_service, so it won't roll the version back
      - name: Build, push and deploy
        if: steps.env.outputs.up == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          declare -A MODULES=(
            [gateway]=GateWay [user-tenant]=UserService [product-inventory]=ProductInventoryService
            [order]=OrderService [payment]=PaymentService [realtime]=RealTimeService
          )
          for svc in "${!MODULES[@]}"; do
            img="$REGISTRY/merchanthub/$svc:$SHA"
            # When re-running the same commit the image already exists and immutable tags forbid re-pushing, so reuse it
            if aws ecr describe-images --repository-name "merchanthub/$svc" --image-ids imageTag="$SHA" > /dev/null 2>&1; then
              echo "$svc: image $SHA already exists, skipping build"
            else
              docker build --build-arg MODULE="${MODULES[$svc]}" -t "$img" .
              docker push "$img"
            fi
            new_td=$(aws ecs describe-task-definition --task-definition "merchanthub-$svc" --query taskDefinition \
              | jq --arg img "$img" '.containerDefinitions[0].image = $img
                  | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
                     requiresCompatibilities, cpu, memory, runtimePlatform}')
            arn=$(aws ecs register-task-definition --cli-input-json "$new_td" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" --task-definition "$arn" > /dev/null
            echo "$svc → $arn"
          done

      # Wait until every service finishes rolling (new tasks pass health checks, old ones drain); if they can't start, the circuit breaker rolls back and this step fails
      - name: Wait for services stable
        if: steps.env.outputs.up == 'true'
        run: |
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services gateway user-tenant product-inventory order payment realtime
          {
            echo "## Deployed: \`$SHA\`"
            aws ecs describe-services --cluster "$CLUSTER" \
              --services gateway user-tenant product-inventory order payment realtime \
              --query 'services[].[serviceName, runningCount, taskDefinition]' --output text \
              | awk '{print "- " $1 ": running " $2 ", " $3}'
          } >> "$GITHUB_STEP_SUMMARY"
