spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mh_user?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&nullCatalogMeansCurrent=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848

merchanthub:
  # Register with the XXL-Job admin (scheduler)
  job:
    xxl:
      enabled: true
      admin-addresses: http://127.0.0.1:8090/xxl-job-admin
      # The admin runs in a container, so calling back the executor on the host goes through host.docker.internal
      address: http://host.docker.internal:9204/
      access-token: ${XXL_JOB_ACCESS_TOKEN}
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
  # Secret for signing tokens (JWT_SECRET from .env); the gateway verifies with the same one
  jwt:
    secret: ${JWT_SECRET}
