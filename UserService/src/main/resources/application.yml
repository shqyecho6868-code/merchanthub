server:
  port: 8104

spring:
  application:
    # D1: old name UserService -> user-tenant (gateway routes and Feign both use this name)
    name: user-tenant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Same db as the gateway: the gateway checks whether the token in Redis is the currently valid one
      database: 2
      timeout: 3000
  # The new database (mh_user) uses Flyway from day one, so no baseline is needed
  # Flowable's event registry engine ships with Liquibase; this project's business tables use Flyway, so disable Boot's Liquibase auto-configuration,
  # otherwise it looks for db/changelog/db.changelog-master.yaml and fails on startup (Flowable's own FLW_* tables are unaffected)
  liquibase:
    enabled: false

# Flowable 7 (D1)
flowable:
  # Create / upgrade the ACT_* engine tables automatically on startup (the task requires "engine tables created by Flowable"). Production often sets false + a DBA runs the official SQL
  database-schema-update: true
  # The processes here have no timers / async tasks, so the async executor is off: one less set of threads polling ACT_RU_JOB
  async-executor-activate: false
  # Auto-deploy classpath:/processes/*.bpmn20.xml; unchanged content doesn't deploy a new version
  check-process-definitions: true
  # audit: records history of process instances, tasks and variables (ACT_HI_*), enough for an approval audit trail; full also records every variable change, which isn't needed
  history-level: audit

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

merchanthub:
  tenant:
    # Tenant plugin enabled since C1 (it was off before because the old IM tables had no tenant_id).
    # These three are "platform-level" tables that themselves define tenants / cross-tenant login, so they're not filtered by merchant:
    #   tenant (the tenant itself), account (at login we don't know who it is yet), merchant_application (the merchant doesn't exist yet when applying)
    # listing_approval and approval_outbox are merchant-scoped tables and get tenant_id appended as usual
    ignore-tables: tenant,account,merchant_application
  # E3: the compensation scan is triggered by XXL-Job's approvalOutboxRelayJob (frequency configured in the admin)
  job:
    xxl:
      enabled: false
      appname: user-tenant
      port: 9204

# G-上 (closing an F1 leftover): only expose health and prometheus, same as other services. The ALB target group health-checks the container's /actuator/health directly
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Local / test logs also carry traceId and tenantId (same format as application-aws.yml): searching by traceId ties together an order's HTTP -> Feign -> MQ consumption
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
