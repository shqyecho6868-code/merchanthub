# AWS cloud config. ECS sets SPRING_PROFILES_ACTIVE=prod,aws -- prod provides routes and other common config; this file only overrides "cloud addresses and credentials".
# Addresses are written into the ECS task env vars by Terraform; secrets come from SSM Parameter Store (task definition secrets), never baked into the image or the repo

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/mh_user?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&nullCatalogMeansCurrent=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      # ElastiCache has no AUTH (passwords aren't supported without in-transit encryption); protected by private subnets + a security group that only allows ECS. Empty string = don't send AUTH
      password: ""
  cloud:
    # Besides the VPC NIC (10.20.x), a Fargate task has a 169.254.172.x link-local NIC (used internally by ECS).
    # Spring picks "the first non-loopback address" by default and would register 169.254 in Nacos, which other services cannot reach.
    # So restrict it to the VPC CIDR (10.20.0.0/16 from infra/env/network.tf)
    inetutils:
      preferred-networks:
        - 10.20.
    nacos:
      # Nacos in the cloud has auth disabled (private subnets only, security group only allows ECS); no credentials on the client = no login request
      username: ""
      password: ""
      discovery:
        server-addr: ${NACOS_ADDR}

merchanthub:
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV}
  job:
    xxl:
      # The XXL-Job admin isn't deployed in the cloud this time (only the order flow runs there), so compensation / reconciliation jobs aren't scheduled; timeout order closing still works via RocketMQ scheduled messages
      enabled: false
      access-token: ""
  jwt:
    secret: ${JWT_SECRET}

# ALB health checks use the readiness probe: it only reflects "can this process take traffic", not the health of dependencies like MySQL / Redis.
# Otherwise a Redis blip would mark every instance unhealthy at once, amplifying a partial failure into a site-wide 503
management:
  endpoint:
    health:
      probes:
        enabled: true

# Search logs by trace / tenant in CloudWatch: the traceId put into MDC by TraceIdFilter and the tenantId put into MDC by TenantContext are printed after the level on every line
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
