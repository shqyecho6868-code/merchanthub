spring:
  application:
    name: GateWay

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    web-application-type: reactive

server:
  port: 10010

# Load-test monitoring. Only expose health and prometheus (no sensitive endpoints like env / heapdump);
# service ports are not exposed outside the gateway and /actuator is not routed by the gateway, so it is unreachable externally.
# Enable histogram buckets for http.server.requests so Prometheus can compute P99 with histogram_quantile (default is only count / sum / max)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
