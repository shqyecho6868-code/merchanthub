spring:
  application:
    name: GateWay

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    web-application-type: reactive

server:
  port: 10010

# F1：压测监控。只暴露 health 和 prometheus（不暴露 env / heapdump 等敏感端点）；
# 服务端口不经网关对外，/actuator 不在网关路由里，外部访问不到。
# http.server.requests 开直方图桶，Prometheus 才能用 histogram_quantile 算 P99（默认只有 count / sum / max）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
