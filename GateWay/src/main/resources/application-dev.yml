# D1: secret for verifying tokens; must match the one user-tenant signs with (JWT_SECRET from .env)
merchanthub:
  jwt:
    secret: ${JWT_SECRET}

spring:
  data:
    redis:
      database: 2
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 30000

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848

    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 60000
            response-timeout: 60000

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:10010"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "PATCH"
                  - "OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 36000

          routes:
            # D1: the old IM UserService was turned into user-tenant (accounts / login / merchant onboarding / approval tasks); strips the /api prefix like the trading services
            - id: user-tenant
              uri: lb://user-tenant
              predicates:
                - Path=/api/user/**,/api/merchant-applications/**,/api/approvals/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            # C1: trading services. Exposed externally under a unified /api prefix, stripped when forwarding (/api/orders/1 -> order's /orders/1).
            # /internal/** is blocked twice: no route for it here, and AuthorizeFilter also rejects it by path segment as a fallback (guards against /api/orders/../internal and the like)
            - id: order
              uri: lb://order
              predicates:
                - Path=/api/orders/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: product-inventory
              uri: lb://product-inventory
              predicates:
                - Path=/api/products/**,/api/skus/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: payment
              uri: lb://payment
              predicates:
                - Path=/api/payments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
