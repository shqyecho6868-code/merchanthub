spring:
  data:
    redis:
      database: 2
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 30000

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: nacos:8848

    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 60000
            response-timeout: 60000

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "PATCH"
                  - "OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 36000

          routes:
            - id: UserService
              uri: lb://UserService
              predicates:
                - Path=/api/user/**,/api/contact/**,/api/group/**

            - id: OfflineDataService
              uri: lb://OfflineDataService
              predicates:
                - Path=/api/message/**

            - id: AiService
              uri: lb://AiService
              predicates:
                - Path=/api/ai/**

            # C1：交易服务。对外统一 /api 前缀，转发时去掉（/api/orders/1 → order 的 /orders/1）。
            # /internal/** 两层挡：这里没有它的路由；AuthorizeFilter 再按路径段兜底拦截（防 /api/orders/../internal 之类）
            - id: order
              uri: lb://order
              predicates:
                - Path=/api/orders/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: product-inventory
              uri: lb://product-inventory
              predicates:
                - Path=/api/products/**,/api/skus/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: payment
              uri: lb://payment
              predicates:
                - Path=/api/payments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
