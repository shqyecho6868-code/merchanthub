server:
  port: 8102

spring:
  application:
    name: realtime
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Same database as user-tenant: the handshake has to verify the login token (access:token:{userId})
      database: 2
      timeout: 3000

merchanthub:
  realtime:
    # Node ID: this is what the route table stores and the Tag used for inter-node forwarding. Defaults to rt-{host IP}-{Netty port}; can also be set explicitly for multi-instance deployments
    node-id: ${REALTIME_NODE_ID:}
    # WebSocket port (Netty). 0 = random port (used by tests that start two nodes in one JVM)
    netty-port: 9101
    # Route TTL: clients send a ping every 30 seconds to renew; if a node crashes and nobody renews, the route disappears after at most this long
    route-ttl: 90s
    # Close the connection after this much read idle time (the client isn't even sending pings)
    idle-timeout: 90s
    # Order event consumer (clustering mode: any node consuming it is fine)
    order-consumer:
      enabled: true
      consume-from: CONSUME_FROM_LAST_OFFSET
  # Secret for verifying tokens on handshake; same as the gateway / user-tenant
  jwt:
    secret: ${JWT_SECRET}

# G-上 (closing an F1 leftover): only expose health and prometheus, same as other services. The ALB target group health-checks the container's /actuator/health directly
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Local / test logs also carry traceId and tenantId (same format as application-aws.yml): searching by traceId ties together an order's HTTP -> Feign -> MQ consumption
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
