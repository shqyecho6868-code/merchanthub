server:
  port: 8106
  # F1：让 Micrometer 能读到 Tomcat 线程池指标（busy / max），压测时判断是不是线程池先满
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: product-inventory
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 表结构由 Flyway 管理（db/migration/V*.sql），与 order 服务一致（D26）。B3 之前 spring.sql.init 建的库没有 Flyway 历史表：
  # baseline-on-migrate 把这种已有库记为 V1，只执行 V2 起的脚本；空库则从 V1 正常执行
  cloud:
    openfeign:
      client:
        config:
          # 跨服务调用必须有超时：悬空扫描查订单，order 慢了这一批就跳过，下一轮再查
          # key 是 @FeignClient 的 contextId（inventoryOrderClient），不是服务名（C2 修，P29）
          inventoryOrderClient:
            connect-timeout: 1000
            read-timeout: 3000
          # D1：发起 / 反查上架审批。超时后不重试，交给补偿扫描（发起接口幂等，补偿重发安全）
          productListingApprovalClient:
            connect-timeout: 1000
            read-timeout: 3000
          default:
            connect-timeout: 1000
            read-timeout: 3000
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

merchanthub:
  inventory:
    settle-consumer:
      # 订阅订单的 ORDER_PAID / ORDER_CLOSED，做确认扣减 / 释放（B3-下）
      enabled: true
    reservation-recon:
      # 预占对账（E3，原 B3-下悬空预占扫描）：预占超过 older-than 仍是 RESERVED → 按订单真实状态释放 / 确认。
      # 由 XXL-Job 的 reservationReconJob 触发，频率在调度中心配。
      # 必须远大于下单事务超时（5 秒）：过了这么久还查不到订单，才能确定它以后也不会出现。
      # 还要大于订单支付时限（15m）+ 余量：正常的待支付订单本来就占着库存，不该每轮都被捞出来问一遍
      older-than: 30m
      batch-size: 100
  product:
    listing-result-consumer:
      # 订阅 user-tenant 的上架审批结果，回写商品状态（D1）
      enabled: true
    listing-compensate:
      # "审核中"超过 older-than 还没结果 → 反查 user-tenant：消息丢了就按反查回写，没发起成功就重新发起（D1）。
      # E3 起由 XXL-Job 的 listingCompensateJob 触发
      # 远大于"审批结束 → 消息到达"的正常耗时（秒级），避免和正常消费抢；又不能太长，否则消息丢了商家要等很久
      older-than: 2m
      batch-size: 100
  job:
    xxl:
      enabled: false
      appname: product-inventory
      port: 9203

# F1：压测监控。只暴露 health 和 prometheus（不暴露 env / heapdump 等敏感端点）；
# 服务端口不经网关对外，/actuator 不在网关路由里，外部访问不到。
# http.server.requests 开直方图桶，Prometheus 才能用 histogram_quantile 算 P99（默认只有 count / sum / max）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
