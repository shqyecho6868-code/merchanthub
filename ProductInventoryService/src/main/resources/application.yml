server:
  port: 8106

spring:
  application:
    name: product-inventory
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 表结构由 Flyway 管理（db/migration/V*.sql），与 order 服务一致（D26）。B3 之前 spring.sql.init 建的库没有 Flyway 历史表：
  # baseline-on-migrate 把这种已有库记为 V1，只执行 V2 起的脚本；空库则从 V1 正常执行
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
