# G-上：AWS 云上配置。ECS 里 SPRING_PROFILES_ACTIVE=prod,aws —— prod 提供路由等通用配置，本文件只覆盖"云上地址和凭证"。
# 地址由 Terraform 写进 ECS task 的环境变量；密码类走 SSM Parameter Store（task 定义里的 secrets），不进镜像、不进仓库

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/mh_product?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  cloud:
    nacos:
      # 云上 Nacos 关了鉴权（只在私有子网、安全组只放行 ECS），客户端不带账号 = 不发登录请求
      username: ""
      password: ""
      discovery:
        server-addr: ${NACOS_ADDR}
        # Fargate 每个 task 有独立的 VPC 网卡，注册的就是 task 的私网 IP，其他服务能直接连

merchanthub:
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV}
  job:
    xxl:
      # 云上本次不部署 XXL-Job 调度中心（G-上只跑通下单链路），补偿 / 对账任务不调度；超时关单靠 RocketMQ 定时消息照常工作
      enabled: false
      access-token: ""
  storage:
    s3:
      # 商品图片：S3 替换 MinIO（ProductImageService）
      enabled: true
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}

# ALB 健康检查用 readiness 探针：只反映"本进程能不能接流量"，不聚合 MySQL / Redis 等依赖的健康。
# 否则 Redis 抖一下，所有实例同时被 ALB 判成不健康，局部故障被放大成整站 503
management:
  endpoint:
    health:
      probes:
        enabled: true

# CloudWatch 里按租户搜日志：TenantContext 放进 MDC 的 tenantId 打在每行日志级别后面
logging:
  pattern:
    level: "%5p [tenant:%X{tenantId:-}]"
