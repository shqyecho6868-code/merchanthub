spring:
  datasource:
    # 每个服务一个库（mh_product）：服务之间不能跨库 join、也不能共用本地事务，只能通过接口交互
    url: jdbc:mysql://127.0.0.1:3306/mh_product?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848

merchanthub:
  # E3：注册到 XXL-Job 调度中心
  job:
    xxl:
      enabled: true
      admin-addresses: http://127.0.0.1:8090/xxl-job-admin
      # 调度中心在容器里，回调宿主机上的执行器要走 host.docker.internal
      address: http://host.docker.internal:9203/
      access-token: ${XXL_JOB_ACCESS_TOKEN}
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
