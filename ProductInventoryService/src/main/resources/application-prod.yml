spring:
  datasource:
    # One database per service (mh_product): services can't join across databases or share local transactions; they interact only through APIs
    url: jdbc:mysql://mysql:3306/mh_product?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: nacos:8848

merchanthub:
  # E3: register with the XXL-Job admin (scheduler)
  job:
    xxl:
      enabled: true
      admin-addresses: http://xxl-job-admin:8080/xxl-job-admin
      access-token: ${XXL_JOB_ACCESS_TOKEN}
  rocketmq:
    namesrv-addr: namesrv:9876
