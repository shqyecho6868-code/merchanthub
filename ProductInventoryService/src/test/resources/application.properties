# Integration tests don't start the order event consumer by default: most inventory tests don't need MQ, and turning it off also avoids starting the RocketMQ container.
# Tests that need it (OrderSettleConsumerIT) turn it on themselves
merchanthub.inventory.settle-consumer.enabled=false

# Reservation recon and listing compensation are triggered by XXL-Job; tests call reconcile() / scan() directly (the executor is disabled in IntegrationTestBase)

# The listing approval result consumer is off by default; ListingResultConsumerIT turns it on itself
merchanthub.product.listing-result-consumer.enabled=false
