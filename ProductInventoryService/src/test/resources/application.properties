# 集成测试默认不启动订单事件消费者：大多数库存测试不需要 MQ，关掉后也不会触发 RocketMQ 容器启动。
# 需要的测试（OrderSettleConsumerIT）自己打开
merchanthub.inventory.settle-consumer.enabled=false

# 悬空预占扫描默认关闭，DanglingReservationIT 直接调 scan()
merchanthub.inventory.dangling-scan.enabled=false

# D1：上架审批结果消费者、补偿扫描默认关闭；ListingResultConsumerIT 自己打开消费者，补偿用例直接调 scan()
merchanthub.product.listing-result-consumer.enabled=false
merchanthub.product.listing-compensate.enabled=false
