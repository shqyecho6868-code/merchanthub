# RocketMQ broker config (local single-node development)
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48

# The broker registers this address with the NameServer; clients connect to it directly to send and receive.
# Without it the broker registers its container IP (172.x), which Java apps on the Mac can't reach -> send timeouts.
# The name host.docker.internal lets both host programs and containers reach the same address:
#   - in containers: Docker resolves it to the host (extra_hosts in compose), then the port mapping reaches the broker
#   - on the host: add a line 127.0.0.1 host.docker.internal to /etc/hosts
# A LAN IP isn't used because it changes when you switch networks, forcing a config change each time.
brokerIP1=host.docker.internal

# Development convenience: create topics automatically on send. Must be off in production, where topics are planned and created ahead of time
autoCreateTopicEnable=true

# Transaction check-back interval (ms): how often half messages with no COMMIT/ROLLBACK yet are scanned.
# Set explicitly to 10 seconds so check-backs show up quickly in the kill experiment; the check-immunity time is set by the producer per message (30 seconds in order)
transactionCheckInterval=10000
