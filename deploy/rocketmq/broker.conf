# RocketMQ Broker 配置（本地单机开发）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48

# Broker 会把这个地址注册到 NameServer，客户端拿到后直接连它收发消息。
# 不配置时注册的是容器内网 IP（172.x），Mac 上的 Java 程序连不上 → 发消息超时。
# 用 host.docker.internal 这个名字，让“宿主机程序”和“容器”都能连到同一个地址：
#   - 容器里：Docker 把它解析到宿主机（compose 里的 extra_hosts），再经端口映射到 Broker
#   - 宿主机：在 /etc/hosts 里加一行 127.0.0.1 host.docker.internal
# 不用局域网 IP，是因为换网络后 IP 会变，每次都要改配置。
brokerIP1=host.docker.internal

# 开发期方便：发消息时自动建 Topic。生产环境必须关闭，Topic 应提前规划创建
autoCreateTopicEnable=true
