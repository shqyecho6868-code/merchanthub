# docker compose for the middleware EC2 instance (written to /opt/mh/compose.yml by middleware-init.sh.tftpl).
# Versions match the local docker-compose.yml; every difference from local is commented
name: mh

x-cloudwatch: &cloudwatch
  # Container logs go straight to CloudWatch Logs (/merchanthub/middleware), no need to log in and run docker logs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    # One log stream per container, named after the container (awslogs-stream doesn't support templates, so use tag)
    tag: "{{.Name}}"

services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    restart: unless-stopped
    environment:
      MODE: standalone
      # Auth disabled in the cloud: private subnet only, security group admits ECS only; skips 3.x's manual admin-password init on first start.
      # 3.x still requires token / identity even with auth disabled, or it fails to start, so random values are provided
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: mh
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports: ["8848:8848", "9848:9848", "8080:8080"]
    logging: *cloudwatch

  namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports: ["9876:9876"]
    logging: *cloudwatch

  broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    depends_on: [namesrv]
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
    ports: ["10911:10911", "10909:10909"]
    volumes:
      - /opt/mh/broker.conf:/home/rocketmq/broker.conf:ro
      # The init script already chowned the dir to uid 3000 (the image runs as 3000 and can't write a root-owned dir; same as local broker-init)
      - /opt/mh/rocketmq-store:/home/rocketmq/store
    logging: *cloudwatch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Same as local: relies on private subnet + security group; production needs auth and TLS
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    logging: *cloudwatch

  # XXL-Job admin: schedules the compensation / reconciliation jobs of every service. Its database (schema xxl_job)
  # lives on RDS, not in a container here: RDS is already managed and backed up, and the admin itself stays stateless.
  # Profile "xxl": not started by the first "up -d" -- xxl-init.sh starts it once RDS is reachable and the schema is imported.
  # Secrets come in as env vars (Spring relaxed binding), not in PARAMS, so they don't show up in the process command line
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    restart: unless-stopped
    profiles: ["xxl"]
    environment:
      JAVA_OPTS: "-Xms256m -Xmx384m"
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://${RDS_HOST}:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC
        --spring.datasource.username=mhadmin
        --server.servlet.context-path=/xxl-job-admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PW}
      XXL_JOB_ACCESSTOKEN: ${XXL_JOB_TOKEN}
    # 8080 is taken by the Nacos console (same mapping as local)
    ports: ["8090:8080"]
    logging: *cloudwatch
