spring:
  datasource:
    # One database per service (mh_order): services can't join across databases or share local transactions; they interact only via APIs
    url: jdbc:mysql://mysql:3306/mh_order?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: nacos:8848
  elasticsearch:
    uris: http://elasticsearch:9200

merchanthub:
  rocketmq:
    namesrv-addr: namesrv:9876
  job:
    xxl:
      enabled: true
      admin-addresses: http://xxl-job-admin:8080/xxl-job-admin
      access-token: ${XXL_JOB_ACCESS_TOKEN}
