server:
  port: 8107

spring:
  application:
    name: order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 表结构由 Flyway 管理（db/migration/V*.sql）。B2 之前的库是 spring.sql.init 建的、没有 Flyway 历史表：
  # baseline-on-migrate 让 Flyway 把这种已有库记为 V1，只执行 V2 起的脚本；空库则从 V1 正常执行
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      database: 0
      timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          # 跨服务调用必须有超时（行业规范）。不配的话默认读超时 60 秒，下游一慢，order 的线程全部卡死。
          # C2 踩坑（P29）：这里的 key 是 @FeignClient 的 contextId，不是服务名。之前写成 product-inventory，
          # 配置从没生效过（实际读超时 60 秒），FeignResilienceIT 才测出来
          productInventoryClient:
            connect-timeout: 1000
            read-timeout: 3000
          # 兜底：任何没单独配置的客户端也有超时，key 再写错也不会退回 60 秒
          default:
            connect-timeout: 1000
            read-timeout: 3000
    # C2：LoadBalancer 自带的"换个实例再试"也关掉（需要 spring-retry 才生效，现在没引入；显式写出来防止以后被带进来）。
    # 不重试的原因见 ProductInventoryFeignConfig
    loadbalancer:
      retry:
        enabled: false
    sentinel:
      # 启动就连控制台，不等第一次请求（否则控制台里看不到服务，直到有人调接口）
      eager: true
      transport:
        # 本机和控制台通信的端口：控制台通过它拉监控数据、推规则。被占用会自动 +1
        port: 8719

merchanthub:
  order:
    # C2：限流 / 熔断阈值，含义与取法见 SentinelProperties 和 C2 笔记
    sentinel:
      rate-limit:
        per-tenant-qps: 20
        # 个别商家单独提额，例：'[9]': 50。租户 7 故意不配，压测时让它被限
        tenant-overrides: {}
      degrade:
        slow-rt-ms: 1000
        slow-ratio: 0.5
        error-ratio: 0.5
        min-requests: 10
        stat-interval-ms: 10000
        open-seconds: 10
    # 待支付订单的支付时限（Duration 格式）：到期由 ORDER_TIMEOUT 定时消息触发超时关单（B3-下）
    pay-timeout: 15m
    # "订单已创建"事件的发送方案，二选一：TX_MESSAGE（RocketMQ 事务消息）/ OUTBOX（本地消息表）。见 B2 笔记 Q1
    event-mode: OUTBOX
    tx:
      # 半消息至少隔这么久才会被回查；必须大于本地事务超时 5 秒（B2 笔记 Q2）
      check-immunity-seconds: 30
      # 回查时查不到订单、且消息不满这么久 → 返回 UNKNOW 稍后重查，而不是直接回滚（第二道防线，B2 笔记 Q2）
      rollback-min-age-seconds: 30
      debug:
        # 以下两项只给实验/测试用，生产保持默认
        pause-after-local-commit-ms: 0
        report-unknown: false
    debug:
      # 只给 🧑 实验用：库存预占后、订单落库前停顿多少毫秒，制造"支付回调早于订单"（B3-下实验 ①）
      pause-before-persist-ms: 0
    timeout-consumer:
      # 超时关单消费者（订阅 ORDER_TIMEOUT）
      enabled: true
    notice-consumer:
      # "商家新订单通知"演示消费者（B2 方案 A）
      enabled: true
      consume-from: CONSUME_FROM_LAST_OFFSET
    outbox:
      # 扫描开关、间隔；每批最多取多少条
      scan-enabled: true
      scan-interval-ms: 5000
      batch-size: 100
      # 抢到一条记录后的租约：租约内其他实例不会再发它。必须大于一次发送的最长耗时（3s 超时 × 最多 3 次）
      lease-seconds: 30
      # 第 n 次失败后隔 base × 2^(n-1) 秒再试，封顶 max-backoff；失败满 max-retries 次标记为失败并告警
      base-backoff-seconds: 10
      max-backoff-seconds: 600
      max-retries: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
