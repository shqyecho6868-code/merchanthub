spring:
  datasource:
    # One database per service (mh_order): services can't join across databases or share local transactions; they interact only via APIs
    url: jdbc:mysql://127.0.0.1:3306/mh_order?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        # Sentinel dashboard (mh-sentinel in docker-compose)
        dashboard: 127.0.0.1:8858
        # The dashboard runs in a container and must connect back to port 8719 on this host, so it needs a host IP reachable from inside the container.
        # The dashboard accepts only IPs, not hostnames (host.docker.internal gives Bad IP), so deploy/c2/start-order.sh looks it up and passes it in
        client-ip: ${SENTINEL_CLIENT_IP:}

  # Order search replica (mh-es in docker-compose, security disabled locally)
  elasticsearch:
    uris: http://127.0.0.1:9200

merchanthub:
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
  # Register locally with the docker-compose XXL-Job admin (console at http://127.0.0.1:8090/xxl-job-admin)
  job:
    xxl:
      enabled: true
      admin-addresses: http://127.0.0.1:8090/xxl-job-admin
      # The admin runs in a container; calling back the executor on the host goes through host.docker.internal
      address: http://host.docker.internal:9201/
      access-token: ${XXL_JOB_ACCESS_TOKEN}
