spring:
  datasource:
    # 每个服务一个库（mh_order）：服务之间不能跨库 join、也不能共用本地事务，只能通过接口交互
    url: jdbc:mysql://127.0.0.1:3306/mh_order?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        # Sentinel 控制台（docker-compose 的 mh-sentinel）
        dashboard: 127.0.0.1:8858
        # 控制台跑在容器里，要回连本机的 8719 拉数据，需要告诉它一个"容器里能访问到宿主机"的 IP。
        # 控制台只认 IP 不认主机名（填 host.docker.internal 会报 Bad IP，P30），所以由 deploy/c2/start-order.sh 现查现传
        client-ip: ${SENTINEL_CLIENT_IP:}

merchanthub:
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
