# AWS cloud config. In ECS, SPRING_PROFILES_ACTIVE=prod,aws -- prod provides common config like routes; this file only overrides "cloud addresses and credentials".
# Addresses are written into ECS task env vars by Terraform; secrets come from SSM Parameter Store (task definition secrets), never baked into the image or repo

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/mh_order?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      # ElastiCache has no AUTH (passwords unsupported without in-transit encryption); protected by private subnets + a security group allowing only ECS. Empty string = don't send AUTH
      password: ""
  cloud:
    # Besides the VPC NIC (10.20.x), a Fargate task has a 169.254.172.x link-local NIC (used internally by ECS).
    # Spring picks the "first non-loopback address" by default and would register 169.254 in Nacos, which other services can't reach.
    # So restrict to the VPC CIDR (10.20.0.0/16 in infra/env/network.tf)
    inetutils:
      preferred-networks:
        - 10.20.
    nacos:
      # Cloud Nacos has auth disabled (private subnets only, security group allows only ECS); no credentials on the client = no login request
      username: ""
      password: ""
      discovery:
        server-addr: ${NACOS_ADDR}
  elasticsearch:
    uris: ${ES_URIS}

merchanthub:
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV}
  order:
    outbox:
      monitor:
        # Push the backlog counts to CloudWatch; the alarm (infra/env/alarms.tf) watches OutboxStalePending
        cloudwatch:
          enabled: true
  job:
    xxl:
      # The XXL-Job admin runs on the middleware EC2 (schema xxl_job on RDS). Compensation / reconciliation jobs
      # are the safety net of every async flow here; without them the cloud once silently piled up 129k unsent outbox rows
      enabled: true
      admin-addresses: ${XXL_JOB_ADMIN}
      access-token: ${XXL_JOB_ACCESS_TOKEN}
      # Register the VPC address, not the 169.254 link-local one (same reason as inetutils.preferred-networks above)
      ip-prefix: "10.20."
      log-path: /tmp/xxl-job

# ALB health checks use the readiness probe: it only reflects "can this process take traffic", not aggregated health of dependencies like MySQL / Redis.
# Otherwise a Redis blip would mark every instance unhealthy at once in the ALB, amplifying a partial failure into a site-wide 503
management:
  endpoint:
    health:
      probes:
        enabled: true

# Search logs by trace / tenant in CloudWatch: the traceId put into MDC by TraceIdFilter and the tenantId put into MDC by TenantContext appear after the level on every line
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
