# G-上：AWS 云上配置。ECS 里 SPRING_PROFILES_ACTIVE=prod,aws —— prod 提供路由等通用配置，本文件只覆盖"云上地址和凭证"。
# 地址由 Terraform 写进 ECS task 的环境变量；密码类走 SSM Parameter Store（task 定义里的 secrets），不进镜像、不进仓库

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/mh_order?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      # ElastiCache 没开 AUTH（未开传输加密时不支持密码），靠私有子网 + 安全组只放行 ECS 访问。空字符串 = 不发 AUTH
      password: ""
  cloud:
    # Fargate task 里除了 VPC 网卡（10.20.x）还有一块 169.254.172.x 的链路本地网卡（ECS 内部用，P50）。
    # Spring 默认取"第一个非回环地址"，会把 169.254 注册进 Nacos，别的服务按这个地址连不上。
    # 这里指定只用 VPC 网段（infra/env/network.tf 的 10.20.0.0/16）
    inetutils:
      preferred-networks:
        - 10.20.
    nacos:
      # 云上 Nacos 关了鉴权（只在私有子网、安全组只放行 ECS），客户端不带账号 = 不发登录请求
      username: ""
      password: ""
      discovery:
        server-addr: ${NACOS_ADDR}
  elasticsearch:
    uris: ${ES_URIS}

merchanthub:
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV}
  job:
    xxl:
      # 云上本次不部署 XXL-Job 调度中心（G-上只跑通下单链路），补偿 / 对账任务不调度；超时关单靠 RocketMQ 定时消息照常工作
      enabled: false
      access-token: ""

# ALB 健康检查用 readiness 探针：只反映"本进程能不能接流量"，不聚合 MySQL / Redis 等依赖的健康。
# 否则 Redis 抖一下，所有实例同时被 ALB 判成不健康，局部故障被放大成整站 503
management:
  endpoint:
    health:
      probes:
        enabled: true

# CloudWatch 里按租户搜日志：TenantContext 放进 MDC 的 tenantId 打在每行日志级别后面
logging:
  pattern:
    level: "%5p [tenant:%X{tenantId:-}]"
