# E3 起补偿扫描由 XXL-Job 触发，服务里没有定时器；测试也不注册执行器（merchanthub.job.xxl.enabled 默认 false），
# 需要扫描的测试（OrderOutboxCompensationIT）自己定时调用 relay.scan()。
# 同一个 JVM 里缓存的多个 Spring 上下文连着同一个测试库，如果各自都在扫描就会互相抢记录（pitfalls P17）

# 同理，"支付成功"消费者默认不启动，需要的测试（OrderPaidIT 的端到端用例）自己打开
merchanthub.order.pay-consumer.enabled=false

# 超时关单消费者同理默认不启动，需要的测试（PayTimeoutIT）自己打开
merchanthub.order.timeout-consumer.enabled=false

# C2：测试不连 Sentinel 控制台，也不提前初始化（规则由 SentinelRulesConfig / 用例自己加载，不依赖控制台）
spring.cloud.sentinel.transport.dashboard=
spring.cloud.sentinel.eager=false
