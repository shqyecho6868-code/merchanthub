# 集成测试默认关闭本地消息表的补偿扫描：同一个 JVM 里会缓存多个 Spring 上下文，它们连着同一个测试库，
# 开着扫描就会互相抢别的测试类的待发送记录（B2 实测，见 pitfalls P17）。需要扫描的测试（OrderOutboxCompensationIT）自己打开。
merchanthub.order.outbox.scan-enabled=false

# 集成测试默认不启动"商家通知"消费者：每个缓存的上下文都起一个同组消费者会互相分走队列、拖慢负载均衡。
# 需要它的测试（MerchantNoticeConsumerIT）自己打开
merchanthub.order.notice-consumer.enabled=false

# 同理，"支付成功"消费者默认不启动，需要的测试（OrderPaidIT 的端到端用例）自己打开
merchanthub.order.pay-consumer.enabled=false

# 超时关单消费者同理默认不启动，需要的测试（PayTimeoutIT）自己打开
merchanthub.order.timeout-consumer.enabled=false
