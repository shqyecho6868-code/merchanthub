# Compensation scans are triggered by XXL-Job and the service has no timer; tests don't register an executor either (merchanthub.job.xxl.enabled defaults to false),
# and tests that need scanning (OrderOutboxCompensationIT) call relay.scan() on their own schedule.
# Multiple cached Spring contexts in one JVM share the same test DB; if each scanned, they'd fight over records

# Likewise, the "payment succeeded" consumer is off by default; tests that need it (the end-to-end cases in OrderPaidIT) turn it on
merchanthub.order.pay-consumer.enabled=false

# Likewise, the timeout-close consumer is off by default; tests that need it (PayTimeoutIT) turn it on
merchanthub.order.timeout-consumer.enabled=false

# Tests don't connect to the Sentinel dashboard or eager-init it (rules are loaded by SentinelRulesConfig / the test cases, independent of the dashboard)
spring.cloud.sentinel.transport.dashboard=
spring.cloud.sentinel.eager=false

# The backlog monitor's fallback scan would make every cached test context scan the shared DB and steal rows from the test that owns them;
# its schedule is pushed far out too. Tests that exercise it (OutboxSelfHealIT) call report() / maybeFallback() themselves
merchanthub.order.outbox.monitor.fallback-enabled=false
merchanthub.order.outbox.monitor.initial-delay-ms=3600000
