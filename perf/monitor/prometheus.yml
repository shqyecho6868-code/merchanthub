# Load-test monitoring. Services run on the host and Prometheus in a container, so it scrapes via host.docker.internal
# Metrics come from each service's /actuator/prometheus (Micrometer: http.server.requests histograms, hikaricp_*, jvm_*, tomcat_*)
global:
  scrape_interval: 5s       # tests last a few minutes; the default 15s is too coarse to see jitter
  evaluation_interval: 5s

scrape_configs:
  - job_name: merchanthub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:10010']
        labels: { service: gateway }
      - targets: ['host.docker.internal:8107']
        labels: { service: order }
      - targets: ['host.docker.internal:8106']
        labels: { service: product-inventory }
      - targets: ['host.docker.internal:8108']
        labels: { service: payment }
