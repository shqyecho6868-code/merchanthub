# MerchantHub local development middleware
# Host ports are in each service's ports mapping below; passwords come from .env (not committed), template in .env.example
name: merchanthub

services:
  mysql:
    image: mysql:8.0
    container_name: mh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: merchanthub
      TZ: America/Los_Angeles
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mh-net

  redis:
    image: redis:7.4
    container_name: mh-redis
    restart: unless-stopped
    # The Redis image has no password env var, so it's set via command-line args; appendonly keeps data across restarts
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mh-net

  nacos:
    # Matches nacos-client 3.0.3 bundled with SCA 2025.0.0.0
    image: nacos/nacos-server:v3.0.3
    container_name: mh-nacos
    restart: unless-stopped
    environment:
      MODE: standalone                 # standalone mode with embedded storage, no MySQL dependency
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      TZ: America/Los_Angeles
    ports:
      - "8080:8080"                    # 3.x console
      - "8848:8848"                    # HTTP API
      - "9848:9848"                    # gRPC: client registration/subscription goes here; missing it makes service registration time out
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - mh-net

  namesrv:
    # Matches RocketMQ 5.3.1 recommended by SCA 2025.0.0.0
    image: apache/rocketmq:5.3.1
    container_name: mh-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"   # the default heap is large; shrunk for local dev
    ports:
      - "9876:9876"
    networks:
      - mh-net

  # One-shot job: new named volumes are owned by root but the RocketMQ image runs as uid 3000, so the broker can't write its store dir and fails to start
  broker-init:
    image: apache/rocketmq:5.3.1
    user: root
    entrypoint: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
    restart: "no"

  broker:
    image: apache/rocketmq:5.3.1
    container_name: mh-broker
    restart: unless-stopped
    depends_on:
      namesrv:
        condition: service_started
      broker-init:
        condition: service_completed_successfully
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    # Let containers (Dashboard etc.) resolve host.docker.internal to the host; see broker.conf for the brokerIP1 trade-off
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "10911:10911"                  # client send/receive
      - "10909:10909"                  # VIP channel (listenPort - 2)
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks:
      - mh-net

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: mh-rmq-dashboard
    restart: unless-stopped
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"                    # 2.1.0 listens on 8082 inside the container (not 8080), which conveniently avoids Nacos console's 8080
    networks:
      - mh-net

  sentinel:
    # Sentinel console. There's no official Docker image (third-party images are of unknown provenance), so the official release jar runs on the official JRE image:
    # downloaded into a named volume on first start and reused afterwards. Version matches sentinel-core 1.8.9 managed by SCA 2025.0.0.0
    image: eclipse-temurin:17-jre
    container_name: mh-sentinel
    restart: unless-stopped
    environment:
      SENTINEL_VERSION: "1.8.9"
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-sentinel}
    entrypoint:
      - sh
      - -c
      - |
        JAR=/opt/sentinel/sentinel-dashboard-$$SENTINEL_VERSION.jar
        [ -s "$$JAR" ] || curl -fL -o "$$JAR" https://github.com/alibaba/Sentinel/releases/download/$$SENTINEL_VERSION/sentinel-dashboard-$$SENTINEL_VERSION.jar || exit 1
        exec java -Xms128m -Xmx256m -Dserver.port=8858 \
          -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=$$SENTINEL_PASSWORD \
          -jar "$$JAR"
    # The console connects back to each service's 8719 to pull metrics and push rules; services run on the host, reached via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8858:8858"                    # the default 8080 would clash with the Nacos console
    volumes:
      - sentinel-jar:/opt/sentinel
    networks:
      - mh-net

  # XXL-Job admin (console http://127.0.0.1:8090/xxl-job-admin, default account admin / 123456).
  # The 3.x image defaults context-path to /; set explicitly to /xxl-job-admin to match each service's admin-addresses
  # Tables live in MySQL's xxl_job database: an existing mysql volume won't rerun init scripts, so import once with deploy/xxl-job/init-xxl-job.sh
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: mh-xxl-job
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      # Same as the mysql container: the console filters dispatch logs by browser local time, and with UTC just-run jobs "can't be found"
      TZ: America/Los_Angeles
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}
        --server.servlet.context-path=/xxl-job-admin
    # Executors (the services) run on the host; the admin calls back to them via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8080"                    # 8080 is taken by the Nacos console
    networks:
      - mh-net

  # Order search replica. Single node, security disabled (local demo only), version matches the Java Client 8.18 managed by Spring Boot
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: mh-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - mh-net

  # Canal Server poses as a MySQL replica reading the binlog, subscribed only to mh_order's order header / item tables; the Canal client in the order service pulls and syncs to ES
  canal:
    image: canal/canal-server:v1.1.7
    container_name: mh-canal
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      canal.destinations: mh_order
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: ${MYSQL_ROOT_PASSWORD}
      canal.instance.connectionCharset: UTF-8
      canal.instance.filter.regex: mh_order\.(orders|order_item)
      # No table-schema history (tsdb) needed, which drops its default embedded H2 dependency
      canal.instance.tsdb.enable: "false"
    ports:
      - "11111:11111"
    networks:
      - mh-net

  # Load-test monitoring, not started by default (profiles); for load tests: docker compose --profile perf up -d.
  # Prometheus scrapes /actuator/prometheus of each service on the host; Grafana is provisioned with the datasource and the "MerchantHub load test" dashboard (anonymous read-only)
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mh-prometheus
    profiles: ["perf"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9090"                    # host port 9090 is often taken by the MinIO console, so 9091
    volumes:
      - ./perf/monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - mh-net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: mh-grafana
    profiles: ["perf"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local dashboards without login (read-only); edit as admin / GRAFANA_PASSWORD from .env
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./perf/monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./perf/monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mh-net

volumes:
  es-data:
  sentinel-jar:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-store:

networks:
  mh-net:
    driver: bridge
