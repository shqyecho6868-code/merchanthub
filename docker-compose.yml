# MerchantHub 本地开发中间件
# 版本说明与端口、账号见 docs/env-setup.md；密码等变量在 .env（不提交），模板见 .env.example
name: merchanthub

services:
  mysql:
    image: mysql:8.0
    container_name: mh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: merchanthub
      TZ: America/Los_Angeles
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mh-net

  redis:
    image: redis:7.4
    container_name: mh-redis
    restart: unless-stopped
    # Redis 镜像没有密码环境变量，只能通过启动参数设置；appendonly 让重启后数据不丢
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mh-net

  nacos:
    # 与 SCA 2025.0.0.0 自带的 nacos-client 3.0.3 对齐
    image: nacos/nacos-server:v3.0.3
    container_name: mh-nacos
    restart: unless-stopped
    environment:
      MODE: standalone                 # 单机模式，数据用内置存储，不依赖 MySQL
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      TZ: America/Los_Angeles
    ports:
      - "8080:8080"                    # 3.x 控制台
      - "8848:8848"                    # HTTP API
      - "9848:9848"                    # gRPC：客户端注册/订阅走这里，漏映射会导致服务注册超时
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - mh-net

  namesrv:
    # 与 SCA 2025.0.0.0 推荐的 RocketMQ 5.3.1 对齐
    image: apache/rocketmq:5.3.1
    container_name: mh-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"   # 默认堆很大，本地开发调小
    ports:
      - "9876:9876"
    networks:
      - mh-net

  # 一次性任务：新建的命名卷属于 root，而 RocketMQ 镜像以 uid 3000 运行，Broker 写不进存储目录会启动失败
  broker-init:
    image: apache/rocketmq:5.3.1
    user: root
    entrypoint: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
    restart: "no"

  broker:
    image: apache/rocketmq:5.3.1
    container_name: mh-broker
    restart: unless-stopped
    depends_on:
      namesrv:
        condition: service_started
      broker-init:
        condition: service_completed_successfully
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    # 让容器（Dashboard 等）把 host.docker.internal 解析到宿主机；brokerIP1 的取舍见 broker.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "10911:10911"                  # 客户端收发消息
      - "10909:10909"                  # VIP 通道（listenPort - 2）
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks:
      - mh-net

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: mh-rmq-dashboard
    restart: unless-stopped
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"                    # 2.1.0 版容器内默认监听 8082（不是 8080），正好避开 Nacos 控制台的 8080
    networks:
      - mh-net

  sentinel:
    # C2：Sentinel 控制台。官方没有发布 Docker 镜像（第三方镜像来源不可控），所以用官方 JRE 镜像跑官方 release 的 jar：
    # 首次启动时下载到命名卷，之后直接用。版本与 SCA 2025.0.0.0 管理的 sentinel-core 1.8.9 一致
    image: eclipse-temurin:17-jre
    container_name: mh-sentinel
    restart: unless-stopped
    environment:
      SENTINEL_VERSION: "1.8.9"
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-sentinel}
    entrypoint:
      - sh
      - -c
      - |
        JAR=/opt/sentinel/sentinel-dashboard-$$SENTINEL_VERSION.jar
        [ -s "$$JAR" ] || curl -fL -o "$$JAR" https://github.com/alibaba/Sentinel/releases/download/$$SENTINEL_VERSION/sentinel-dashboard-$$SENTINEL_VERSION.jar || exit 1
        exec java -Xms128m -Xmx256m -Dserver.port=8858 \
          -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=$$SENTINEL_PASSWORD \
          -jar "$$JAR"
    # 控制台要主动回连各服务的 8719 拉监控、推规则；服务跑在宿主机上，用 host.docker.internal 找到它们
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8858:8858"                    # 默认 8080 会和 Nacos 控制台冲突
    volumes:
      - sentinel-jar:/opt/sentinel
    networks:
      - mh-net

  # E3：XXL-Job 调度中心（控制台 http://127.0.0.1:8090/xxl-job-admin，默认账号 admin / 123456）。
  # 3.x 镜像默认 context-path 是 /，这里显式设成 /xxl-job-admin，和各服务配置的 admin-addresses 一致
  # 表结构在 MySQL 的 xxl_job 库：已有的 mysql 卷不会再跑初始化脚本，首次用 deploy/e3/init-xxl-job.sh 导入
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: mh-xxl-job
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      # 和 mysql 容器一致：控制台调度日志按浏览器本地时间筛选，设 UTC 时会"搜不到"刚执行的任务（P42）
      TZ: America/Los_Angeles
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}
        --server.servlet.context-path=/xxl-job-admin
    # 执行器（各服务）跑在宿主机上，调度中心通过 host.docker.internal 回调它们
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8080"                    # 8080 已被 Nacos 控制台占用
    networks:
      - mh-net

  # E2：订单搜索副本。单节点、关闭安全认证（只在本地演示），版本与 Spring Boot 管理的 Java Client 8.18 对齐
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: mh-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - mh-net

  # E2：Canal Server 伪装成 MySQL 从库读 binlog，只订阅 mh_order 的订单头 / 明细表；order 服务里的 Canal 客户端拉取后同步 ES
  canal:
    image: canal/canal-server:v1.1.7
    container_name: mh-canal
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      canal.destinations: mh_order
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: ${MYSQL_ROOT_PASSWORD}
      canal.instance.connectionCharset: UTF-8
      canal.instance.filter.regex: mh_order\.(orders|order_item)
      # 不需要表结构历史（tsdb），省掉它默认依赖的内嵌 H2
      canal.instance.tsdb.enable: "false"
    ports:
      - "11111:11111"
    networks:
      - mh-net

volumes:
  es-data:
  sentinel-jar:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-store:

networks:
  mh-net:
    driver: bridge
