spring:
  datasource:
    # One database per service (mh_payment): payments and orders live in different databases, so payment can't modify orders directly — it can only publish events and let order update itself
    url: jdbc:mysql://mysql:3306/mh_payment?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: nacos:8848

merchanthub:
  rocketmq:
    namesrv-addr: namesrv:9876
  # Register with the XXL-Job admin (scheduler)
  job:
    xxl:
      enabled: true
      admin-addresses: http://xxl-job-admin:8080/xxl-job-admin
      access-token: ${XXL_JOB_ACCESS_TOKEN}
