# AWS cloud config. In ECS, SPRING_PROFILES_ACTIVE=prod,aws — prod provides shared config such as routes; this file only overrides "cloud addresses and credentials".
# Addresses are written into the ECS task's environment variables by Terraform; passwords come from SSM Parameter Store (secrets in the task definition), never baked into the image or the repo

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/mh_payment?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      # ElastiCache has no AUTH enabled (passwords aren't supported without in-transit encryption); we rely on private subnets + a security group that only allows ECS. Empty string = don't send AUTH
      password: ""
  cloud:
    # Besides the VPC NIC (10.20.x), a Fargate task has a 169.254.172.x link-local NIC (used internally by ECS).
    # Spring picks "the first non-loopback address" by default and would register 169.254 with Nacos, which other services can't reach.
    # So restrict it to the VPC CIDR (10.20.0.0/16 from infra/env/network.tf)
    inetutils:
      preferred-networks:
        - 10.20.
    nacos:
      # Nacos in the cloud has auth disabled (private subnets only, security group only allows ECS); no client credentials = no login request
      username: ""
      password: ""
      discovery:
        server-addr: ${NACOS_ADDR}

merchanthub:
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV}
  job:
    xxl:
      # The XXL-Job admin runs on the middleware EC2 (schema xxl_job on RDS). Compensation / reconciliation jobs
      # are the safety net of every async flow here; without them the cloud once silently piled up 129k unsent outbox rows
      enabled: true
      admin-addresses: ${XXL_JOB_ADMIN}
      access-token: ${XXL_JOB_ACCESS_TOKEN}
      # Register the VPC address, not the 169.254 link-local one (same reason as inetutils.preferred-networks above)
      ip-prefix: "10.20."
      log-path: /tmp/xxl-job

# ALB health checks use the readiness probe: it only reflects "can this process take traffic", without aggregating the health of dependencies like MySQL / Redis.
# Otherwise one Redis blip would make the ALB mark every instance unhealthy at once, amplifying a partial failure into a site-wide 503
management:
  endpoint:
    health:
      probes:
        enabled: true

# To search logs by trace / tenant in CloudWatch: the traceId that TraceIdFilter puts in MDC and the tenantId that TenantContext puts in MDC are printed right after the log level on every line
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
