server:
  port: 8108
  # F1: let Micrometer read Tomcat thread pool metrics (busy / max) to tell during load tests whether the thread pool saturates first
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # New service uses Flyway from day one (db/migration/V*.sql); no legacy database, so no baseline needed
  data:
    redis:
      database: 0
      timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          # Cross-service calls must have timeouts: creating a payment looks up the order; if order is slow, fail fast instead of tying up payment request threads.
          # The key is the @FeignClient contextId (P29); since E3, contextId = paymentOrderClient
          paymentOrderClient:
            connect-timeout: 1000
            read-timeout: 3000
          default:
            connect-timeout: 1000
            read-timeout: 3000
    sentinel:
      eager: true
      transport:
        port: 8720   # Offset from order's 8719 so the dashboard can reach both services on the same machine

merchanthub:
  payment:
    # E3: payment → order circuit-breaker thresholds (same meaning as order's, C2 notes Q3)
    sentinel:
      degrade:
        slow-rt-ms: 1000
        slow-ratio: 0.5
        error-ratio: 0.5
        min-requests: 10
        stat-interval-ms: 10000
        open-seconds: 10
    # E3: reconciliation parameters (job paymentReconJob; frequency is configured in the XXL-Job admin)
    recon:
      # Only check payments that succeeded longer ago than this: earlier events may still be in flight
      grace: 2m
      # Only consider closing payments pending longer than this: it exceeds the order payment window of 15m, so the order has definitely settled by then
      pending-close-after: 30m
      # After this many re-sends without order processing it, escalate to manual handling
      max-resend: 3
      batch-size: 200
    tx:
      # On check-back, if the payment is still pending and the message is younger than this → UNKNOW, check again later (same as B2 order's second line of defense)
      rollback-min-age-seconds: 30
  job:
    xxl:
      enabled: false
      appname: payment
      port: 9202

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# F1: load-test monitoring. Only health and prometheus are exposed (not sensitive endpoints like env / heapdump);
# service ports aren't exposed through the gateway and /actuator isn't in the gateway routes, so it's unreachable from outside.
# Enable histogram buckets for http.server.requests so Prometheus can compute P99 with histogram_quantile (by default there's only count / sum / max)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Local / test logs also carry traceId and tenantId (same format as application-aws.yml): searching by traceId stitches together one order's HTTP → Feign → MQ consumption
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}] [tenant:%X{tenantId:-}]"
