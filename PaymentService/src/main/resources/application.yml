server:
  port: 8108

spring:
  application:
    name: payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 新服务从第一天起就用 Flyway（db/migration/V*.sql），没有历史库，不需要 baseline
  data:
    redis:
      database: 0
      timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          # 跨服务调用必须有超时：建支付单时查订单，order 慢了就快速失败，不拖住支付请求线程
          order:
            connect-timeout: 1000
            read-timeout: 3000

merchanthub:
  payment:
    tx:
      # 回查时支付单仍是待支付、且消息不满这么久 → UNKNOW 稍后重查（同 B2 order 的第二道防线）
      rollback-min-age-seconds: 30

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
