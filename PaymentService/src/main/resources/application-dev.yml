spring:
  datasource:
    # One database per service (mh_payment): payments and orders live in different databases, so payment can't modify orders directly — it can only publish events and let order update itself
    url: jdbc:mysql://127.0.0.1:3306/mh_payment?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848

merchanthub:
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
  # E3: register with the XXL-Job admin (scheduler)
  job:
    xxl:
      enabled: true
      admin-addresses: http://127.0.0.1:8090/xxl-job-admin
      # The admin runs in a container, so calling back the executor on the host must go through host.docker.internal
      address: http://host.docker.internal:9202/
      access-token: ${XXL_JOB_ACCESS_TOKEN}
