spring:
  datasource:
    # 每个服务一个库（mh_payment）：支付单和订单不在一个库，payment 不能直接改订单，只能发事件让 order 自己改
    url: jdbc:mysql://127.0.0.1:3306/mh_payment?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: 127.0.0.1:8848

merchanthub:
  rocketmq:
    namesrv-addr: 127.0.0.1:9876
  # E3：注册到 XXL-Job 调度中心
  job:
    xxl:
      enabled: true
      admin-addresses: http://127.0.0.1:8090/xxl-job-admin
      # 调度中心在容器里，回调宿主机上的执行器要走 host.docker.internal
      address: http://host.docker.internal:9202/
      access-token: ${XXL_JOB_ACCESS_TOKEN}
